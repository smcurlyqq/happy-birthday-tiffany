name: Deploy LINE bot

# 不需要終端機，也不需要在自己電腦上裝 Node。
# 需要的四把金鑰放在 repo 的 Settings → Secrets and variables → Actions。
on:
  push:
    branches: [main, claude/korea-trip-planner-tou9gc]
    paths: ['bot/**', '.github/workflows/deploy-bot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          # 這三個會被推上 Cloudflare 當 Worker 的祕密，不會留在 repo 裡
          secrets: |
            LINE_CHANNEL_SECRET
            LINE_CHANNEL_ACCESS_TOKEN
            NOTION_TOKEN
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Where it landed
        run: |
          echo "Worker 部署完成。"
          echo "Webhook URL 要填："
          echo "  https://seoul-loop-bot.<你的-cloudflare-子網域>.workers.dev/webhook"
          echo "子網域在 Cloudflare dashboard → Workers & Pages → Overview 右側可以看到。"
