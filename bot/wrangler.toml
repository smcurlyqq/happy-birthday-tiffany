name = "seoul-loop-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Not secrets — Notion database IDs and the group allow-list.
[vars]
NOTION_MEMBERS_DB   = "c730a79cc4694546942f11785f80cb66"
NOTION_IDEAS_DB     = "883484141f0c4f3c85e713cbbc6a51cb"
NOTION_ITINERARY_DB = "31a197b2431b43d29e66018af9e01086"
NOTION_EXPENSES_DB  = "e7220d9f26ef46008598a0e8583bcd0b"
NOTION_STAYS_DB     = "d2986ee9b16b45c5b4db8938235fdfab"

# Comma-separated LINE group IDs the bot is allowed to work in.
# Empty = setup mode: typing `group id` in a group makes the bot reply with that group's ID.
# Once set, it leaves any other group it is added to and never calls Claude for them.
ALLOWED_GROUP_IDS = ""

# Secrets are set by the deploy workflow (never write them here):
#   LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN, NOTION_TOKEN, ANTHROPIC_API_KEY
