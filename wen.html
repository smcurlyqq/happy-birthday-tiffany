<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1026">
<title>Happy Birthday Wen ✈️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; width:100%; overflow:hidden;}
  html{background:#0b1026;}
  body{
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:#0b1026; color:#fff;
    position:fixed; inset:0;
    -webkit-user-select:none; user-select:none;
    transition:background 1.2s ease;
  }

  /* full-bleed background layer (kills any viewport seam) */
  #bg{position:fixed; inset:-6px; z-index:0; transition:opacity 1.2s ease;
    background:radial-gradient(120% 90% at 50% 15%, #fff4f8 0%, #ffe6ef 40%, #f3d4e5 75%, #e6c1da 100%);}
  body.night #bg{background:linear-gradient(180deg,#070a1f 0%, #0d1233 42%, #241a4a 78%, #4b2a5e 100%);}

  /* ---------- stages ---------- */
  .stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .8s ease;
    z-index:2;
  }
  .stage.on{opacity:1; pointer-events:auto;}
  .wrap{width:100%; max-width:520px; padding:24px; text-align:center;}

  /* ---------- stage 0 : intro ---------- */
  #s0{background:radial-gradient(120% 90% at 50% 20%, #ffe9f1 0%, #ffd9e6 38%, #f6c9dd 70%, #e7b6d2 100%);}
  .introTitle{
    font-family:'Caveat','Segoe Script','Snell Roundhand','Brush Script MT',cursive; font-weight:700;
    font-size:clamp(38px, 12vw, 66px); line-height:1.05;
    color:#c14a72; margin:0 0 6px;
    text-shadow:0 2px 0 rgba(255,255,255,.5);
  }
  .introSub{color:#a15c7a; font-weight:400; font-size:15px; letter-spacing:.3px; margin-bottom:34px;}
  .heartBtn{
    border:0; background:transparent; cursor:pointer; padding:0;
    filter:drop-shadow(0 12px 24px rgba(193,74,114,.4));
    animation:beat 1.5s ease-in-out infinite;
  }
  .heartBtn svg{width:118px; height:auto; display:block;}
  .heartBtn svg path{fill:#ec5f88;}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.1)}}
  .tap0{margin-top:20px; color:#b1547a; font-size:14px; letter-spacing:2px; text-transform:uppercase; animation:blink 1.8s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

  /* ---------- stage 1 : cake ---------- */
  #s1{background:radial-gradient(120% 90% at 50% 15%, #fff4f8 0%, #ffe6ef 40%, #f3d4e5 75%, #e6c1da 100%); transition:opacity .8s ease;}
  .cakeHead{
    font-family:'Caveat','Segoe Script','Snell Roundhand','Brush Script MT',cursive; font-weight:700;
    font-size:clamp(34px, 10vw, 54px); line-height:1.06;
    color:#b8456c; margin-bottom:6px; text-shadow:0 2px 0 rgba(255,255,255,.5);
  }
  .cakeSub{color:#9c5a78; font-size:14.5px; line-height:1.5; margin-bottom:18px;}
  .cakeSub b{color:#c14a72;}
  .cakeArea{position:relative; width:100%; max-width:330px; margin:0 auto;}
  .cakeSvg{width:100%; height:auto; display:block;}

  /* candles */
  .candle{position:absolute; width:9px; height:34px; border-radius:4px;
    background:repeating-linear-gradient(45deg,#f7a8c4 0 6px,#fff 6px 12px);
    box-shadow:0 2px 4px rgba(120,40,80,.25);}
  .wick{position:absolute; left:50%; top:-4px; width:2px; height:5px; background:#3a2b2b; transform:translateX(-50%); border-radius:1px;}
  .flame{position:absolute; left:50%; top:-19px; width:13px; height:19px;
    transform-origin:50% 100%;
    background:radial-gradient(50% 60% at 50% 70%, #fff6c4 0%, #ffd257 42%, #ff8a2b 78%, #ff5a2b 100%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    box-shadow:0 0 14px 4px rgba(255,170,60,.7), 0 0 30px 10px rgba(255,140,40,.35);
    transform:translateX(-50%);
    animation:flick .28s ease-in-out infinite alternate;
    transition:opacity .35s ease, transform .1s linear;
  }
  @keyframes flick{from{transform:translateX(-50%) scaleY(.94) rotate(-3deg)}to{transform:translateX(-50%) scaleY(1.06) rotate(3deg)}}
  .glow{position:absolute; left:50%; top:-26px; width:40px; height:40px; transform:translateX(-50%);
    background:radial-gradient(circle, rgba(255,190,80,.45) 0%, rgba(255,190,80,0) 70%); pointer-events:none;
    transition:opacity .35s ease;}
  .candle.out .flame{opacity:0; transform:translateX(-50%) scaleY(.2);}
  .candle.out .glow{opacity:0;}
  .candle.out .smoke{opacity:1;}
  .smoke{position:absolute; left:50%; top:-16px; width:6px; height:6px; border-radius:50%;
    background:rgba(210,210,220,.55); transform:translateX(-50%); opacity:0;}
  .candle.out .smoke{animation:smoke 1.1s ease-out forwards;}
  @keyframes smoke{0%{opacity:.6; transform:translate(-50%,0) scale(.6)}100%{opacity:0; transform:translate(-50%,-40px) scale(2.4)}}

  .micNote{min-height:22px; margin-top:16px; color:#b8456c; font-size:14.5px; font-weight:500; letter-spacing:.3px;}
  .fallback{margin-top:6px;}
  .fallback a{color:#9c5a78; font-size:13px; text-decoration:underline; cursor:pointer;}

  /* ---------- dim overlay ---------- */
  #dim{position:fixed; inset:0; background:#05060f; opacity:0; pointer-events:none;
    transition:opacity 1.4s ease; z-index:5;}
  #dim.on{opacity:1;}

  /* ---------- stage 2 : flight ---------- */
  #s2{background:transparent;}
  body.night{background:linear-gradient(180deg,#070a1f 0%, #0d1233 42%, #241a4a 78%, #4b2a5e 100%);}
  #sky{position:fixed; inset:0; z-index:1; opacity:0; transition:opacity 1.6s ease; overflow:hidden;}
  #sky.on{opacity:1;}
  .star{position:absolute; background:#fff; border-radius:50%; opacity:0;
    animation:tw 3s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
  .shoot{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    box-shadow:0 0 8px 2px rgba(255,255,255,.9);}
  .moon{position:absolute; top:8%; left:11%; width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8e6 0%, #ffe9b0 55%, #f6d38a 100%);
    box-shadow:0 0 40px 10px rgba(255,230,160,.35);}

  #flight{position:fixed; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;}
  #flight.on{opacity:1;}
  .flightSvg{width:100%; height:100%;}

  .plane{position:absolute; font-size:34px; line-height:1; will-change:transform;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)); transform:translate(-50%,-50%);}

  .cityLabel{
    position:absolute; transform:translate(-50%,-50%);
    font-size:12px; letter-spacing:1px; color:#dfe6ff; text-align:center;
    text-shadow:0 1px 4px rgba(0,0,0,.6); pointer-events:none; white-space:nowrap;
  }
  .cityLabel .zh{display:block; font-weight:600; font-size:14px; color:#fff;}
  .dot{width:9px; height:9px; border-radius:50%; margin:0 auto 5px;
    background:#ffd76a; box-shadow:0 0 12px 3px rgba(255,215,106,.7);}
  .dot.bkk{background:#ff8fbf; box-shadow:0 0 14px 4px rgba(255,143,191,.75); animation:pulse 1.4s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,143,191,.6)}100%{box-shadow:0 0 0 22px rgba(255,143,191,0)}}

  /* Bangkok skyline reveal */
  #skyline{position:fixed; left:0; right:0; bottom:0; z-index:2; height:34%;
    opacity:0; transform:translateY(30px); transition:opacity 1.4s ease, transform 1.4s ease; pointer-events:none;}
  #skyline.on{opacity:1; transform:translateY(0);}

  /* final message */
  #finale{position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 1.4s ease;}
  #finale.on{opacity:1;}
  .finaleCard{text-align:center; padding:24px;}
  .finaleKicker{font-size:13px; letter-spacing:4px; text-transform:uppercase; color:#ffd0e4; margin-bottom:10px;}
  .finaleCity{font-family:'Caveat','Segoe Script','Snell Roundhand','Brush Script MT',cursive; font-weight:700; font-size:clamp(52px, 18vw, 96px); line-height:.95;
    background:linear-gradient(180deg,#fff 0%,#ffd8ea 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 8px 30px rgba(255,143,191,.25);}
  .finaleCityZh{font-size:20px; letter-spacing:8px; color:#ffe3f0; margin-top:2px;}
  .finaleMsg{margin-top:24px; font-size:clamp(19px,5.4vw,26px); font-weight:500; color:#fff;}
  .finaleName{font-family:'Caveat','Segoe Script','Snell Roundhand','Brush Script MT',cursive; font-weight:700; font-size:clamp(30px,9vw,44px); color:#ff9ec7; display:block; margin-top:4px;}
  .finaleSub{margin-top:18px; font-size:14px; color:#c9d0f2; font-weight:300; line-height:1.6;}
  .again{margin-top:26px; display:inline-block; padding:11px 26px; border:1px solid rgba(255,255,255,.35);
    border-radius:40px; color:#fff; font-size:13px; letter-spacing:1px; cursor:pointer; background:rgba(255,255,255,.06);
    transition:background .2s ease;}
  .again:hover{background:rgba(255,255,255,.16);}

  /* confetti + hearts */
  .confetti{position:fixed; top:-20px; width:9px; height:14px; border-radius:2px; z-index:7; pointer-events:none;}
  .fx{position:fixed; z-index:7; pointer-events:none;}
</style>
</head>
<body>
  <div id="bg"></div>

  <!-- Stage 0 : intro -->
  <section class="stage on" id="s0">
    <div class="wrap">
      <div class="introTitle">Happy Birthday<br>Wen</div>
      <div class="introSub">為你準備了一個小小的驚喜 · tap to begin</div>
      <button class="heartBtn" onclick="start()" aria-label="Start">
        <svg viewBox="0 0 32 29"><path d="M16 27.5 C16 27.5 2.2 18.8 2.2 9.6 C2.2 4.9 6 2 9.7 2 C12.8 2 15.1 4 16 6 C16.9 4 19.2 2 22.3 2 C26 2 29.8 4.9 29.8 9.6 C29.8 18.8 16 27.5 16 27.5 Z"/></svg>
      </button>
      <div class="tap0">tap the heart</div>
    </div>
  </section>

  <!-- Stage 1 : cake -->
  <section class="stage" id="s1">
    <div class="wrap">
      <div class="cakeHead">許個願吧，<br>Wen 🎂</div>
      <div class="cakeSub">對著<b>手機下方</b>輕輕吹一口氣<br>把蠟燭吹熄 · blow out the candles</div>
      <div class="cakeArea">
        <svg class="cakeSvg" viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="cakeSide" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#f6d9e6"/>
            </linearGradient>
            <linearGradient id="cakeTop" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffefb"/><stop offset="1" stop-color="#f8e6ee"/>
            </linearGradient>
            <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe1ec"/>

          </defs>
          <!-- shadow -->
          <ellipse cx="150" cy="200" rx="112" ry="11" fill="rgba(120,40,80,.16)"/>
          <!-- plate -->
          <ellipse cx="150" cy="192" rx="128" ry="16" fill="#fdf4f8" stroke="#f0d7e2" stroke-width="2"/>
          <ellipse cx="150" cy="192" rx="126" ry="14" fill="none" stroke="#f0b8ce" stroke-width="3" stroke-dasharray="1.5 7" opacity=".8"/>
          <!-- cake side -->
          <path d="M64 122 Q64 118 68 118 L232 118 Q236 118 236 122 L236 178 Q236 188 226 188 L74 188 Q64 188 64 178 Z" fill="url(#cakeSide)"/>

          <g fill="none" stroke="#f19cb8" stroke-width="4" stroke-linecap="round" opacity=".9">
            <path d="M74 138 Q95 156 116 138"/><path d="M116 138 Q137 156 158 138"/>
            <path d="M158 138 Q179 156 200 138"/><path d="M200 138 Q221 156 236 140"/>
          </g>
          <g fill="#ec7ea0"><circle cx="74" cy="138" r="3"/><circle cx="116" cy="138" r="3"/><circle cx="158" cy="138" r="3"/><circle cx="200" cy="138" r="3"/><circle cx="236" cy="140" r="3"/></g>
          <!-- sprinkles -->
          <g stroke-width="3" stroke-linecap="round">
            <line x1="90" y1="160" x2="94" y2="166" stroke="#ffd76a"/>
            <line x1="140" y1="168" x2="146" y2="166" stroke="#8fd3c0"/>

            <line x1="210" y1="166" x2="216" y2="163" stroke="#ff9ec7"/>
            <line x1="110" y1="172" x2="116" y2="170" stroke="#ff9ec7"/>
          </g>
          <!-- cake top -->
          <ellipse cx="150" cy="118" rx="86" ry="15" fill="url(#cakeTop)"/>
          <!-- dripping cream -->
          <path d="M64 120 Q64 118 68 118 L232 118 Q236 118 236 122
                   Q230 134 224 122 Q218 138 210 123 Q202 136 194 122
                   Q186 138 178 123 Q170 137 162 122 Q154 138 146 123
                   Q138 137 130 122 Q122 138 114 123 Q106 136 98 122
                   Q90 138 82 123 Q74 135 68 121 Z" fill="url(#cream)"/>
          <ellipse cx="150" cy="116" rx="80" ry="12" fill="#fff7fb"/>
        </svg>

        <!-- candles: spell W E N -->
        <div class="candle" style="left:30%; top:34%"><span class="wick"></span><span class="glow"></span><span class="flame"></span><span class="smoke"></span></div>
        <div class="candle" style="left:50%; top:30%"><span class="wick"></span><span class="glow"></span><span class="flame"></span><span class="smoke"></span></div>
        <div class="candle" style="left:70%; top:34%"><span class="wick"></span><span class="glow"></span><span class="flame"></span><span class="smoke"></span></div>
      </div>
      <div class="micNote" id="micNote"></div>
      <div class="fallback"><a onclick="blowOut()">吹不動？點這裡吹熄蠟燭 🌬️</a></div>
    </div>
  </section>

  <!-- dim overlay -->
  <div id="dim"></div>

  <!-- Stage 2 : flight scene -->
  <div id="sky"><div class="moon"></div></div>

  <svg id="skyline" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
    <g fill="#1a1030" opacity="0.95">
      <rect x="0" y="96" width="400" height="44"/>
      <!-- generic towers -->
      <rect x="14" y="70" width="20" height="70"/><rect x="40" y="58" width="14" height="82"/>
      <rect x="300" y="66" width="18" height="74"/><rect x="330" y="52" width="16" height="88"/>
      <rect x="356" y="74" width="22" height="66"/>

      <path d="M182 100 L200 40 L218 100 Z"/>
      <rect x="192" y="96" width="16" height="8"/>
      <path d="M200 34 L204 44 L196 44 Z"/>
      <path d="M160 100 L170 68 L180 100 Z"/><path d="M220 100 L230 68 L240 100 Z"/>
      <!-- mid buildings -->
      <rect x="70" y="82" width="18" height="58"/><rect x="94" y="74" width="12" height="66"/>
      <rect x="112" y="86" width="16" height="54"/><rect x="252" y="80" width="16" height="60"/>
      <rect x="272" y="88" width="12" height="52"/>
    </g>
    <g fill="#ffcf6a" opacity="0.85">
      <rect x="18" y="78" width="3" height="4"/><rect x="26" y="86" width="3" height="4"/>
      <rect x="44" y="66" width="3" height="4"/><rect x="46" y="80" width="3" height="4"/>
      <rect x="76" y="90" width="3" height="4"/><rect x="98" y="82" width="3" height="4"/>
      <rect x="306" y="76" width="3" height="4"/><rect x="335" y="62" width="3" height="4"/>
      <rect x="338" y="80" width="3" height="4"/><rect x="362" y="84" width="3" height="4"/>
      <rect x="196" y="80" width="8" height="4"/>

  </svg>

  <div id="flight">
    <svg class="flightSvg" id="fsvg" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path id="route" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.4"
            stroke-linecap="round" stroke-dasharray="2 9"
            d="M300 150 Q120 300 120 540"/>
    </svg>
    <div class="cityLabel" id="lblTpe"><span class="dot"></span><span class="zh">台北</span>Taipei</div>
    <div class="cityLabel" id="lblBkk"><span class="dot bkk"></span><span class="zh">曼谷</span>Bangkok</div>

  <!-- finale -->
  <div id="finale">
    <div class="finaleCard">
      <div class="finaleKicker">now boarding · 下一站</div>
      <div class="finaleCity">Bangkok</div>
      <div class="finaleCityZh">曼 谷</div>
      <div class="finaleMsg">生日快樂<span class="finaleName">Wen ✈️💗</span></div>
      <div class="finaleSub">願你的新一歲，像這趟旅程一樣<br>充滿冒險、陽光與好多好多的愛 🌴</div>
      <div class="again" onclick="restart()">↺ 再玩一次</div>
    </div>
  </div>

<script>
  /* ============ blow detection tuning ============ */
  var BLOW=0.055, TARGET=2.0, blowAccum=0, extinguished=false, micOn=false, rafId=null, audioCtx=null;

  /* ============ Web Audio SFX (no files) ============ */
  var SFX=null;
  function ac(){
    if(!SFX){
      try{ SFX=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
      try{
        var comp=SFX.createDynamicsCompressor();
        comp.threshold.value=-20; comp.knee.value=18; comp.ratio.value=10; comp.attack.value=0.002; comp.release.value=0.15;
        var mg=SFX.createGain(); mg.gain.value=2.6;
        comp.connect(mg); mg.connect(SFX.destination); SFX._bus=comp;
      }catch(e){ SFX._bus=SFX.destination; }
    }
    if(SFX && SFX.state==='suspended'){ try{ SFX.resume(); }catch(e){} }
    return SFX;
  }
  function tone(freq,dur,type,vol,when){
    var c=ac(); if(!c) return;
    var t=c.currentTime+(when||0);
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c._bus); o.start(t); o.stop(t+dur+0.03);
  }
  function sfxDream(){
    var c=ac(); if(!c) return; var t=c.currentTime;
    [784,988,1319,1568,2093].forEach(function(f,i){
      var o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      var g=c.createGain(); var tt=t+i*0.07;
      g.gain.setValueAtTime(0.0001,tt);
      g.gain.exponentialRampToValueAtTime(0.28,tt+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,tt+0.9);
      o.connect(g); g.connect(c._bus); o.start(tt); o.stop(tt+0.95);
    });
  }
  function sfxChime(){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.6,'sine',0.5,i*0.09); tone(f*2,0.45,'triangle',0.16,i*0.09); }); }
  function sfxPoof(){
    var c=ac(); if(!c) return; var t=c.currentTime;
    var len=Math.floor(c.sampleRate*0.42);
    var b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2); }
    var s=c.createBufferSource(); s.buffer=b;
    var f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(1100,t); f.frequency.exponentialRampToValueAtTime(220,t+0.36);
    var g=c.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    s.connect(f); f.connect(g); g.connect(c._bus); s.start(t); s.stop(t+0.42);
  }
  /* airplane take-off whoosh */
  function sfxJet(){
    var c=ac(); if(!c) return; var t=c.currentTime; var D=2.4;
    var len=Math.floor(c.sampleRate*D);
    var b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1); }
    var s=c.createBufferSource(); s.buffer=b;
    var f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.8;
    f.frequency.setValueAtTime(300,t);
    f.frequency.exponentialRampToValueAtTime(1400,t+1.1);
    f.frequency.exponentialRampToValueAtTime(400,t+D);
    var g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.7);
    g.gain.setValueAtTime(0.22,t+1.4);
    g.gain.exponentialRampToValueAtTime(0.0001,t+D);
    s.connect(f); f.connect(g); g.connect(c._bus); s.start(t); s.stop(t+D);
  }

  /* ============ stage helpers ============ */
  function show(id){
    document.querySelectorAll('.stage').forEach(function(s){s.classList.remove('on')});
    var el=document.getElementById(id); if(el) el.classList.add('on');
  }

  function start(){
    ac(); sfxDream();
    show('s1');
    startMic();
  }

  async function startMic(){
    var note=document.getElementById('micNote');
    note.textContent='🎤 準備好了…吹吧！';
    try{
      var stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(e){} }
      var src=audioCtx.createMediaStreamSource(stream);
      var analyser=audioCtx.createAnalyser(); analyser.fftSize=1024;
      src.connect(analyser);
      var buf=new Uint8Array(analyser.fftSize);
      micOn=true;
      (function loop(){
        analyser.getByteTimeDomainData(buf);
        var sum=0;
        for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum+=v*v; }
        var rms=Math.sqrt(sum/buf.length);
        reactFlames(rms);
        if(rms>BLOW){ blowAccum+=rms; } else { blowAccum*=0.85; }
        if(blowAccum>TARGET && !extinguished){ blowOut(); }
        if(!extinguished){ rafId=requestAnimationFrame(loop); }
      })();
    }catch(e){
      micOn=false;
      note.textContent='（沒有麥克風權限 — 用下面的按鈕吹熄）';
    }
  }

  function reactFlames(rms){
    if(extinguished) return;
    var lean=Math.max(-1,Math.min(1,(rms-BLOW)*10));
    var sc=Math.max(.35,1-Math.max(0,rms-BLOW)*4);
    document.querySelectorAll('.candle .flame').forEach(function(f){
      f.style.transform='translateX(-50%) rotate('+(lean*20)+'deg) scaleY('+sc+')';
    });
  }

  function blowOut(){
    if(extinguished) return; extinguished=true;
    if(rafId) cancelAnimationFrame(rafId);
    sfxPoof();
    document.getElementById('micNote').textContent='✨ 願望已收到 ✨';
    var cs=document.querySelectorAll('.candle');
    cs.forEach(function(c,i){ setTimeout(function(){ c.classList.add('out'); }, i*180); });
    var lastOut=cs.length*180;
    /* darken the screen */
    setTimeout(function(){ document.getElementById('dim').classList.add('on'); }, lastOut+300);
    /* in the dark: switch to night + start the flight */
    setTimeout(function(){
      show('');                       /* hide cake */
      document.body.classList.add('night');
      buildStars();
      document.getElementById('sky').classList.add('on');
      /* lift the dim so the night sky shows through */
      setTimeout(function(){ document.getElementById('dim').classList.remove('on'); }, 500);
      setTimeout(startFlight, 900);
    }, lastOut+1900);
  }

  /* ============ night sky ============ */
  function buildStars(){
    var sky=document.getElementById('sky');
    if(sky._built) return; sky._built=true;
    var n=90;
    for(var i=0;i<n;i++){
      var s=document.createElement('div'); s.className='star';
      var sz=Math.random()*2.4+0.6;
      s.style.width=sz+'px'; s.style.height=sz+'px';
      s.style.left=(Math.random()*100)+'vw';
      s.style.top=(Math.random()*75)+'vh';
      s.style.animationDelay=(Math.random()*3)+'s';
      s.style.animationDuration=(2+Math.random()*3)+'s';
      sky.appendChild(s);
    }
  }

  /* ============ flight animation ============ */
  function positionLabels(){
    /* place TPE / BKK labels on top of the SVG route endpoints */
    var svg=document.getElementById('fsvg');
    var r=svg.getBoundingClientRect();
    /* viewBox 400x700 with slice: compute scale + offsets */
    var scale=Math.max(r.width/400, r.height/700);
    var offX=(r.width-400*scale)/2, offY=(r.height-700*scale)/2;
    function toScreen(vx,vy){ return {x:r.left+offX+vx*scale, y:r.top+offY+vy*scale}; }
    var a=toScreen(300,150), b=toScreen(120,540);
    var t=document.getElementById('lblTpe'), k=document.getElementById('lblBkk');
    t.style.left=a.x+'px'; t.style.top=(a.y-30)+'px';
    k.style.left=b.x+'px'; k.style.top=(b.y+34)+'px';
  }

  function startFlight(){
    document.getElementById('flight').classList.add('on');
    positionLabels();
    window.addEventListener('resize', positionLabels);

    var path=document.getElementById('route');
    var plane=document.getElementById('plane');
    var svg=document.getElementById('fsvg');
    var total=path.getTotalLength();

    /* keep the dotted travel-map arc visible; just fly the plane along it */
    sfxJet();

    function toScreen(pt){
      var r=svg.getBoundingClientRect();
      var scale=Math.max(r.width/400, r.height/700);
      var offX=(r.width-400*scale)/2, offY=(r.height-700*scale)/2;
      return {x:r.left+offX+pt.x*scale, y:r.top+offY+pt.y*scale};
    }

    var start=null, dur=3400;
    function fly(ts){
      if(!start) start=ts;
      var p=Math.min(1,(ts-start)/dur);
      var ease=p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;   /* easeInOutQuad */
      var here=path.getPointAtLength(ease*total);
      var ahead=path.getPointAtLength(Math.min(total, ease*total+1));
      var s=toScreen(here);
      var ang=Math.atan2((ahead.y-here.y),(ahead.x-here.x))*180/Math.PI;
      /* emoji plane points up-right (~ -45deg from travel dir) */
      plane.style.left=s.x+'px'; plane.style.top=s.y+'px';
      plane.style.transform='translate(-50%,-50%) rotate('+(ang+45)+'deg)';
      if(p<1){ requestAnimationFrame(fly); }
      else { arrive(); }
    }
    requestAnimationFrame(fly);
  }

  function arrive(){
    /* land at Bangkok: skyline rises, confetti, message */
    document.getElementById('skyline').classList.add('on');
    setTimeout(function(){
      document.getElementById('flight').classList.remove('on');
      document.getElementById('finale').classList.add('on');
      sfxChime();
      burst();
      setTimeout(floatHearts, 400);
    }, 1100);
  }

  /* ============ celebration fx ============ */
  var COLORS=['#ffd76a','#ff9ec7','#a9c2f0','#c9b8ec','#8fd3c0','#ffffff'];
  function burst(){ for(var i=0;i<90;i++){ setTimeout(makeConfetti,i*18); } }
  function makeConfetti(){
    var c=document.createElement('div'); c.className='confetti';
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
    var rot=Math.random()*360, dur=2.8+Math.random()*2.4, drift=(Math.random()*180-90);
    document.body.appendChild(c);
    var start=null, sh=window.innerHeight+40;
    function step(ts){ if(!start)start=ts; var p=(ts-start)/(dur*1000);
      if(p>=1){c.remove();return;}
      var y=p*sh, x=Math.sin(p*6+rot)*drift;
      c.style.transform='translate('+x+'px,'+y+'px) rotate('+(rot+p*720)+'deg)';
      c.style.opacity=(1-p); requestAnimationFrame(step);
    } requestAnimationFrame(step);
  }
  function floatHearts(){
    for(var i=0;i<14;i++){
      (function(k){ setTimeout(function(){
        var size=15+Math.random()*18;
        var h=document.createElement('div'); h.className='fx';
        h.innerHTML='<svg viewBox="0 0 32 29" width="'+size+'" height="'+size+'"><path d="M16 27.5 C16 27.5 2.2 18.8 2.2 9.6 C2.2 4.9 6 2 9.7 2 C12.8 2 15.1 4 16 6 C16.9 4 19.2 2 22.3 2 C26 2 29.8 4.9 29.8 9.6 C29.8 18.8 16 27.5 16 27.5 Z" fill="rgba(255,158,199,0.75)"/></svg>';
        var startX=10+Math.random()*80;
        h.style.left=startX+'vw'; h.style.top='100vh';
        document.body.appendChild(h);
        var start=null, dur=3400+Math.random()*2000, rise=window.innerHeight*0.9, drift=(Math.random()*80-40);
        function step(ts){ if(!start)start=ts; var p=(ts-start)/dur;
          if(p>=1){ h.remove(); return; }
          var y=-p*rise, x=Math.sin(p*3.2+k)*drift;
          var o=p<0.1?(p/0.1):(p<0.8?1:1-(p-0.8)/0.2);
          h.style.transform='translate('+x+'px,'+y+'px) rotate('+(Math.sin(p*4+k)*14)+'deg)';
          h.style.opacity=Math.max(0,o); requestAnimationFrame(step);
        } requestAnimationFrame(step);
      }, k*90); })(i);
    }
  }

  /* ============ restart ============ */
  function restart(){
    extinguished=false; blowAccum=0;
    document.body.classList.remove('night');
    document.getElementById('dim').classList.remove('on');
    document.getElementById('sky').classList.remove('on');
    document.getElementById('flight').classList.remove('on');
    document.getElementById('skyline').classList.remove('on');
    document.getElementById('finale').classList.remove('on');
    document.querySelectorAll('.candle').forEach(function(c){c.classList.remove('out')});
    document.querySelectorAll('.candle .flame').forEach(function(f){f.style.transform=''});
    /* reset route dash */
    var path=document.getElementById('route');
    path.style.transition='none'; path.style.strokeDasharray='2 9'; path.style.strokeDashoffset='0';
    document.getElementById('micNote').textContent='';
    show('s0');
  }
</script>
