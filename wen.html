<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; width:100%; overflow:hidden;}
  html{background:#dff3d3;}
  body{
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:#dff3d3; color:#fff;
    -webkit-user-select:none; user-select:none;
    transition:background 1.2s ease;
  }
  body.night{background:#0b1026;}

  /* full-bleed background layer (light green) — overshoots viewport so it can never seam */
  #bg{position:fixed; left:-2vw; width:104vw; top:-10vh; height:120vh; z-index:0; transition:opacity 1.2s ease;
    background:radial-gradient(120% 75% at 50% 20%, #f4fbef 0%, #e4f6db 40%, #ceecbf 75%, #b9e2a6 100%);}
  body.night #bg{background:linear-gradient(180deg,#070a1f 0%, #0d1233 42%, #241a4a 78%, #4b2a5e 100%);}

  /* ---------- stages ---------- */
  .stage{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .8s ease; z-index:2;}
  .stage.on{opacity:1; pointer-events:auto;}
  .wrap{width:100%; max-width:520px; padding:24px; text-align:center;}

  /* ---------- stage 0 : intro — tap the image ---------- */
  #s0{background:radial-gradient(120% 90% at 50% 20%, #f0fbe8 0%, #ddf3d0 38%, #c7e9b6 70%, #b1df9c 100%);}
  .peekHint{font-size:15px; color:#4b7a34; letter-spacing:.4px; margin-bottom:24px; line-height:1.6;}
  .peekHint b{color:#c14a72;}
  .tapImgWrap{position:relative; display:inline-block; cursor:pointer; animation:bob 2.6s ease-in-out infinite;}
  .tapImgWrap:active{transform:scale(.97);}
  .tapImg{display:block; max-width:76vw; max-height:52vh; width:auto; border-radius:22px;
    box-shadow:0 18px 40px rgba(70,110,45,.3); border:5px solid #fff;}
  .ring{position:absolute; inset:-10px; border-radius:28px; border:2px solid rgba(120,190,90,.75);
    animation:ring 1.8s ease-out infinite;}
  @keyframes ring{0%{transform:scale(.98); opacity:.8}100%{transform:scale(1.12); opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .imgPlaceholder{display:flex; align-items:center; justify-content:center; text-align:center;
    width:220px; height:220px; border-radius:22px; border:2px dashed #8ab06a; color:#4b7a34;
    background:#f4fbef; font-size:13px; padding:16px; line-height:1.5;}

  /* ---------- stage 1 : blow ---------- */
  #s1{background:radial-gradient(120% 90% at 50% 15%, #f4fbef 0%, #e4f6db 40%, #cdecbd 75%, #b7e0a4 100%);}
  .hbdBig{font-family:'Caveat','Segoe Script','Snell Roundhand','Brush Script MT',cursive; font-weight:700;
    font-size:clamp(34px,11vw,56px); line-height:1; color:#c14a72; margin-bottom:2px;
    text-shadow:0 2px 0 rgba(255,255,255,.55);}
  .hbdName{font-family:'Caveat','Segoe Script','Snell Roundhand','Brush Script MT',cursive; font-weight:700;
    font-size:clamp(30px,9vw,46px); line-height:1; color:#3f8a3a; margin-bottom:8px;
    text-shadow:0 2px 0 rgba(255,255,255,.55);}
  .blowSub{color:#4b7a34; font-size:14.5px; line-height:1.55; margin-bottom:34px;}
  .blowSub b{color:#c14a72;}
  .blowWrap{position:relative; display:block; width:min(84vw, 340px); margin:0 auto;}
  .blowImg{display:block; width:100%; height:auto; filter:drop-shadow(0 10px 16px rgba(50,80,35,.28));}
  .blowImg.placeholder{border-radius:16px; border:2px dashed #8ab06a;}

  /* candles anchored on each egg-head */
  #candles{position:absolute; inset:0; pointer-events:none;}
  .fl{position:absolute; width:16px; height:34px; transform:translate(-50%,-100%);}
  .fl .stick{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:4px; height:13px;
    border-radius:2px; background:repeating-linear-gradient(45deg,#f7a8c4 0 5px,#fff 5px 10px);}
  .fl .flame{position:absolute; left:50%; bottom:11px; width:14px; height:21px; transform-origin:50% 100%;
    background:radial-gradient(50% 60% at 50% 70%, #fff6c4 0%, #ffd257 42%, #ff8a2b 78%, #ff5a2b 100%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    box-shadow:0 0 13px 4px rgba(255,170,60,.7), 0 0 30px 11px rgba(255,140,40,.32);
    transform:translateX(-50%); animation:flick .28s ease-in-out infinite alternate;
    transition:opacity .35s ease, transform .12s linear;}
  @keyframes flick{from{transform:translateX(-50%) scaleY(.94) rotate(-4deg)}to{transform:translateX(-50%) scaleY(1.06) rotate(4deg)}}
  .fl .smoke{position:absolute; left:50%; bottom:12px; width:6px; height:6px; border-radius:50%;
    background:rgba(210,210,220,.6); transform:translateX(-50%); opacity:0;}
  .fl.out .flame{opacity:0; transform:translateX(-50%) scaleY(.15);}
  .fl.out .smoke{animation:smoke 1.1s ease-out forwards;}
  @keyframes smoke{0%{opacity:.6; transform:translate(-50%,0) scale(.6)}100%{opacity:0; transform:translate(-50%,-40px) scale(2.4)}}

  .micNote{min-height:22px; margin-top:20px; color:#c14a72; font-size:14.5px; font-weight:500; letter-spacing:.3px;}
  .fallback{margin-top:6px;}
  .fallback a{color:#4b7a34; font-size:13px; text-decoration:underline; cursor:pointer;}

  /* ---------- dim overlay ---------- */
  #dim{position:fixed; inset:0; background:#05060f; opacity:0; pointer-events:none;
    transition:opacity 1.4s ease; z-index:5;}
  #dim.on{opacity:1;}

  /* ---------- flight scene (night) ---------- */
  body.night{background:linear-gradient(180deg,#070a1f 0%, #0d1233 42%, #241a4a 78%, #4b2a5e 100%);}
  #sky{position:fixed; inset:0; z-index:1; opacity:0; transition:opacity 1.6s ease; overflow:hidden;}
  #sky.on{opacity:1;}
  .star{position:absolute; background:#fff; border-radius:50%; opacity:0; animation:tw 3s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
  .moon{position:absolute; top:8%; left:11%; width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8e6 0%, #ffe9b0 55%, #f6d38a 100%);
    box-shadow:0 0 40px 10px rgba(255,230,160,.35);}

  #flight{position:fixed; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;}
  #flight.on{opacity:1;}
  .flightSvg{width:100%; height:100%;}
  .plane{position:absolute; font-size:34px; line-height:1; will-change:transform;

  .cityLabel{position:absolute; transform:translate(-50%,-50%); font-size:12px; letter-spacing:1px;
    color:#dfe6ff; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,.6); pointer-events:none; white-space:nowrap;}
  .cityLabel .zh{display:block; font-weight:600; font-size:14px; color:#fff;}
  .dot{width:9px; height:9px; border-radius:50%; margin:0 auto 5px; background:#ffd76a; box-shadow:0 0 12px 3px rgba(255,215,106,.7);}
  .dot.bkk{background:#ff8fbf; box-shadow:0 0 14px 4px rgba(255,143,191,.75); animation:pulse 1.4s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,143,191,.6)}100%{box-shadow:0 0 0 22px rgba(255,143,191,0)}}

  #skyline{position:fixed; left:0; right:0; bottom:0; z-index:2; height:34%;
    opacity:0; transform:translateY(30px); transition:opacity 1.4s ease, transform 1.4s ease; pointer-events:none;}
  #skyline.on{opacity:1; transform:translateY(0);}

  /* ---------- finale : ticket + celebration ---------- */
  #finale{position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 1.4s ease; overflow-y:auto; padding:24px 16px;}
  #finale.on{opacity:1; pointer-events:auto;}
  .finaleCard{text-align:center; padding:20px; width:100%; max-width:420px;}
  .finaleKicker{font-size:13px; letter-spacing:4px; text-transform:uppercase; color:#ffd0e4; margin-bottom:14px;}

  .ticket{position:relative; margin:0 auto 26px; max-width:340px;
    background:linear-gradient(135deg,#fff 0%,#fff2f7 100%); color:#3a1030;
    border-radius:16px; padding:20px 22px; box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:pop .6s cubic-bezier(.2,1.3,.4,1) both;}
  @keyframes pop{0%{transform:scale(.6) translateY(20px); opacity:0}100%{transform:scale(1) translateY(0); opacity:1}}
  .ticket:before,.ticket:after{content:''; position:absolute; top:50%; width:22px; height:22px;
    background:#241a4a; border-radius:50%; transform:translateY(-50%);}
  .ticket:before{left:-11px;} .ticket:after{right:-11px;}
  .tkTop{display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:15px;}
  .tkPlane{font-size:20px;}
  .tkRoute{display:flex; align-items:center; justify-content:center; gap:12px; margin:12px 0 4px; font-weight:600;}
  .tkRoute .code{font-size:26px; letter-spacing:2px;}
  .tkDash{flex:1; border-top:2px dashed #d9a; min-width:34px;}
  .tkCity{display:flex; justify-content:space-between; font-size:12px; color:#a06; margin-top:2px; letter-spacing:1px;}
  .tkTear{border-top:2px dashed #e3b6c8; margin:14px -22px;}
  .tkOneway{font-size:12.5px; color:#a06; letter-spacing:2px; text-transform:uppercase; margin-top:12px;}
  .tkGift{font-size:13.5px; color:#8a2d5a; margin-top:6px; line-height:1.5;}

  .thanksBig{font-family:'Caveat','Segoe Script','Snell Roundhand','Brush Script MT',cursive; font-weight:700;
    font-size:clamp(44px,15vw,72px); line-height:.95;
    background:linear-gradient(180deg,#fff 0%,#ffd8ea 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 8px 30px rgba(255,143,191,.25);}
  .thanksMsg{margin-top:16px; font-size:20px; font-weight:500; color:#fff;}
  .thanksSub{margin-top:16px; font-size:14px; color:#c9d0f2; font-weight:300; line-height:1.7;}
  .again{margin-top:26px; display:inline-block; padding:11px 26px; border:1px solid rgba(255,255,255,.35);
    border-radius:40px; color:#fff; font-size:13px; letter-spacing:1px; cursor:pointer; background:rgba(255,255,255,.06);}

  /* confetti + hearts */
  .confetti{position:fixed; top:-20px; width:9px; height:14px; border-radius:2px; z-index:7; pointer-events:none;}
  .fx{position:fixed; z-index:7; pointer-events:none;}
</style>
</head>

<script>
  /* ============ blow detection tuning ============ */
  var BLOW=0.055, TARGET=2.0, blowAccum=0, extinguished=false, rafId=null, audioCtx=null;

  /* ============ Web Audio SFX ============ */
  var SFX=null;
  function ac(){
    if(!SFX){
      try{ SFX=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
      try{
        var comp=SFX.createDynamicsCompressor();
        comp.threshold.value=-20; comp.knee.value=18; comp.ratio.value=10; comp.attack.value=0.002; comp.release.value=0.15;
        var mg=SFX.createGain(); mg.gain.value=2.6;
        comp.connect(mg); mg.connect(SFX.destination); SFX._bus=comp;
      }catch(e){ SFX._bus=SFX.destination; }
    }
    if(SFX && SFX.state==='suspended'){ try{ SFX.resume(); }catch(e){} }
    return SFX;
  }
  function tone(freq,dur,type,vol,when){
    var c=ac(); if(!c) return;
    var t=c.currentTime+(when||0);
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c._bus); o.start(t); o.stop(t+dur+0.03);
  }
  function sfxDream(){
    var c=ac(); if(!c) return; var t=c.currentTime;
    [784,988,1319,1568,2093].forEach(function(f,i){
      var o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      var g=c.createGain(); var tt=t+i*0.07;
      g.gain.setValueAtTime(0.0001,tt);
      g.gain.exponentialRampToValueAtTime(0.28,tt+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,tt+0.9);
      o.connect(g); g.connect(c._bus); o.start(tt); o.stop(tt+0.95);
    });
  }
  function sfxChime(){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.6,'sine',0.5,i*0.09); tone(f*2,0.45,'triangle',0.16,i*0.09); }); }
  function sfxPoof(){
    var c=ac(); if(!c) return; var t=c.currentTime;
    var len=Math.floor(c.sampleRate*0.42);
    var b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2); }
    var s=c.createBufferSource(); s.buffer=b;
    var f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(1100,t); f.frequency.exponentialRampToValueAtTime(220,t+0.36);
    var g=c.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    s.connect(f); f.connect(g); g.connect(c._bus); s.start(t); s.stop(t+0.42);
  }
  function sfxJet(){
    var c=ac(); if(!c) return; var t=c.currentTime; var D=2.4;
    var len=Math.floor(c.sampleRate*D);
    var b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1); }
    var s=c.createBufferSource(); s.buffer=b;
    var f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.8;
    f.frequency.setValueAtTime(300,t);
    f.frequency.exponentialRampToValueAtTime(1400,t+1.1);
    f.frequency.exponentialRampToValueAtTime(400,t+D);
    var g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.7);
    g.gain.setValueAtTime(0.22,t+1.4);
    g.gain.exponentialRampToValueAtTime(0.0001,t+D);
    s.connect(f); f.connect(g); g.connect(c._bus); s.start(t); s.stop(t+D);
  }

  /* ============ stage helpers ============ */
  function show(id){
    document.querySelectorAll('.stage').forEach(function(s){s.classList.remove('on')});
    var el=document.getElementById(id); if(el) el.classList.add('on');
  }

  function start(){
    ac(); sfxDream();
    show('s1');
    startMic();
  }

  async function startMic(){
    var note=document.getElementById('micNote');
    note.textContent='🎤 準備好了…吹吧！';
    try{
      var stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(e){} }
      var src=audioCtx.createMediaStreamSource(stream);
      var analyser=audioCtx.createAnalyser(); analyser.fftSize=1024;
      src.connect(analyser);
      var buf=new Uint8Array(analyser.fftSize);
      (function loop(){
        analyser.getByteTimeDomainData(buf);
        var sum=0;
        for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum+=v*v; }
        var rms=Math.sqrt(sum/buf.length);
        reactFlames(rms);
        if(rms>BLOW){ blowAccum+=rms; } else { blowAccum*=0.85; }
        if(blowAccum>TARGET && !extinguished){ blowOut(); }
        if(!extinguished){ rafId=requestAnimationFrame(loop); }
      })();
    }catch(e){
      note.textContent='（沒有麥克風權限 — 用下面的按鈕吹熄）';
    }
  }

  function reactFlames(rms){
    if(extinguished) return;
    var lean=Math.max(-1,Math.min(1,(rms-BLOW)*10));
    var sc=Math.max(.35,1-Math.max(0,rms-BLOW)*4);
    document.querySelectorAll('#candles .flame').forEach(function(f){
      f.style.transform='translateX(-50%) rotate('+(lean*22)+'deg) scaleY('+sc+')';
    });
  }

  function blowOut(){
    if(extinguished) return; extinguished=true;
    if(rafId) cancelAnimationFrame(rafId);
    sfxPoof();
    document.getElementById('micNote').textContent='✨ 許個願 ✨';
    var cs=document.querySelectorAll('#candles .fl');
    cs.forEach(function(c,i){ setTimeout(function(){ c.classList.add('out'); }, i*130); });
    var lastOut=cs.length*130;
    setTimeout(function(){ document.getElementById('dim').classList.add('on'); }, lastOut+300);
    setTimeout(function(){
      show('');
      document.body.classList.add('night');
      document.documentElement.style.background='#0b1026';
      buildStars();
      document.getElementById('sky').classList.add('on');
      setTimeout(function(){ document.getElementById('dim').classList.remove('on'); }, 500);
      setTimeout(startFlight, 900);
    }, lastOut+1900);
  }

  /* ============ night sky ============ */
  function buildStars(){
    var sky=document.getElementById('sky');
    if(sky._built) return; sky._built=true;
    for(var i=0;i<90;i++){
      var s=document.createElement('div'); s.className='star';
      var sz=Math.random()*2.4+0.6;
      s.style.width=sz+'px'; s.style.height=sz+'px';
      s.style.left=(Math.random()*100)+'vw';
      s.style.top=(Math.random()*75)+'vh';
      s.style.animationDelay=(Math.random()*3)+'s';
      s.style.animationDuration=(2+Math.random()*3)+'s';
      sky.appendChild(s);
    }
  }

  /* ============ flight ============ */
  function svgToScreen(svg,pt){
    var r=svg.getBoundingClientRect();
    var scale=Math.max(r.width/400, r.height/700);
    var offX=(r.width-400*scale)/2, offY=(r.height-700*scale)/2;
    return {x:r.left+offX+pt.x*scale, y:r.top+offY+pt.y*scale};
  }
  function positionLabels(){
    var svg=document.getElementById('fsvg');
    var a=svgToScreen(svg,{x:300,y:150}), b=svgToScreen(svg,{x:120,y:540});
    var t=document.getElementById('lblTpe'), k=document.getElementById('lblBkk');
    t.style.left=a.x+'px'; t.style.top=(a.y-30)+'px';
    k.style.left=b.x+'px'; k.style.top=(b.y+34)+'px';
  }
  function startFlight(){
    document.getElementById('flight').classList.add('on');
    positionLabels();
    window.addEventListener('resize', positionLabels);
    var path=document.getElementById('route');
    var plane=document.getElementById('plane');
    var svg=document.getElementById('fsvg');
    var total=path.getTotalLength();
    sfxJet();
    var start=null, dur=3400;
    function fly(ts){
      if(!start) start=ts;
      var p=Math.min(1,(ts-start)/dur);
      var ease=p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      var here=path.getPointAtLength(ease*total);
      var ahead=path.getPointAtLength(Math.min(total, ease*total+1));
      var s=svgToScreen(svg,here);
      var ang=Math.atan2((ahead.y-here.y),(ahead.x-here.x))*180/Math.PI;
      plane.style.left=s.x+'px'; plane.style.top=s.y+'px';
      plane.style.transform='translate(-50%,-50%) rotate('+(ang+45)+'deg)';
      if(p<1){ requestAnimationFrame(fly); } else { arrive(); }
    }
    requestAnimationFrame(fly);
  }
  function arrive(){
    document.getElementById('skyline').classList.add('on');
    setTimeout(function(){
      document.getElementById('flight').classList.remove('on');
      document.getElementById('finale').classList.add('on');
      sfxChime(); burst(); setTimeout(floatHearts,400);
    }, 1100);
  }

  /* ============ celebration fx ============ */
  var COLORS=['#ffd76a','#ff9ec7','#a9c2f0','#c9b8ec','#8fd3c0','#ffffff'];
  function burst(){ for(var i=0;i<90;i++){ setTimeout(makeConfetti,i*18); } }
  function makeConfetti(){
    var c=document.createElement('div'); c.className='confetti';
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
    var rot=Math.random()*360, dur=2.8+Math.random()*2.4, drift=(Math.random()*180-90);
    document.body.appendChild(c);
    var start=null, sh=window.innerHeight+40;
    function step(ts){ if(!start)start=ts; var p=(ts-start)/(dur*1000);
      if(p>=1){c.remove();return;}
      var y=p*sh, x=Math.sin(p*6+rot)*drift;
      c.style.transform='translate('+x+'px,'+y+'px) rotate('+(rot+p*720)+'deg)';
      c.style.opacity=(1-p); requestAnimationFrame(step);
    } requestAnimationFrame(step);
  }
  function floatHearts(){
    for(var i=0;i<14;i++){
      (function(k){ setTimeout(function(){
        var size=15+Math.random()*18;
        var h=document.createElement('div'); h.className='fx';
        h.innerHTML='<svg viewBox="0 0 32 29" width="'+size+'" height="'+size+'"><path d="M16 27.5 C16 27.5 2.2 18.8 2.2 9.6 C2.2 4.9 6 2 9.7 2 C12.8 2 15.1 4 16 6 C16.9 4 19.2 2 22.3 2 C26 2 29.8 4.9 29.8 9.6 C29.8 18.8 16 27.5 16 27.5 Z" fill="rgba(255,158,199,0.75)"/></svg>';
        h.style.left=(10+Math.random()*80)+'vw'; h.style.top='100vh';
        document.body.appendChild(h);
        var start=null, dur=3400+Math.random()*2000, rise=window.innerHeight*0.9, drift=(Math.random()*80-40);
        function step(ts){ if(!start)start=ts; var p=(ts-start)/dur;
          if(p>=1){ h.remove(); return; }
          var y=-p*rise, x=Math.sin(p*3.2+k)*drift;
          var o=p<0.1?(p/0.1):(p<0.8?1:1-(p-0.8)/0.2);
          h.style.transform='translate('+x+'px,'+y+'px) rotate('+(Math.sin(p*4+k)*14)+'deg)';
          h.style.opacity=Math.max(0,o); requestAnimationFrame(step);
        } requestAnimationFrame(step);
      }, k*90); })(i);
    }
  }

  /* ============ restart ============ */
  function restart(){
    extinguished=false; blowAccum=0;
    document.body.classList.remove('night');
    document.documentElement.style.background='';
    document.getElementById('dim').classList.remove('on');
    document.getElementById('sky').classList.remove('on');
    document.getElementById('flight').classList.remove('on');
    document.getElementById('skyline').classList.remove('on');
    document.getElementById('finale').classList.remove('on');
    document.querySelectorAll('#candles .fl').forEach(function(c){c.classList.remove('out')});
    document.querySelectorAll('#candles .flame').forEach(function(f){f.style.transform=''});
    document.getElementById('micNote').textContent='';
    show('s0');
  }
</script>
</body>
